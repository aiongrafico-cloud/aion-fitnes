name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y tests
        run: |
          npm ci
          npm test

      - name: Build web y sincronizar con Android
        run: |
          npm run build
          npx cap sync android

      # Los runners de ubuntu ya traen el SDK de Android (ANDROID_HOME).
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aion-fitness-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
