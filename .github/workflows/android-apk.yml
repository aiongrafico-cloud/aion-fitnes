name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y tests
        run: |
          npm ci
          npm test

      - name: Build web y sincronizar con Android
        run: |
          npm run build
          npx cap sync android

      # Los runners de ubuntu ya traen el SDK de Android (ANDROID_HOME).
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../aion-fitness.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aion-fitness-apk
          path: aion-fitness.apk

      # Publica el APK como release: se descarga desde el móvil con
      # https://github.com/<usuario>/<repo>/releases/latest/download/aion-fitness.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aion Fitness 1.0.${{ github.run_number }}
          body: APK de Aion Fitness generado automáticamente desde ${{ github.sha }}.
          files: aion-fitness.apk
          make_latest: true
